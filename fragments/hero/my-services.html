<!-- Hero tab: My Services.

     Swapped into #hero-tabs as innerHTML. The whole tablist travels with the
     panel so the selected state is carried by the response, not held in the
     browser (htmx "tabs-hateoas"). The selected tab omits hx-get: re-fetching
     the state you are already in would be a wasted request.

     Every button keeps a stable id. htmx restores focus after a swap by looking
     the previously focused element up again with document.getElementById, so a
     button without an id would drop keyboard focus onto <body> -- the same
     failure the carousel arrows are shaped to avoid. -->
<div class="hero--options" role="tablist" aria-label="About Tatang Haryadi">
    <button type="button" role="tab" id="hero-tab-1" class="hero--links"
        aria-selected="false" aria-controls="hero-panel"
        hx-get="fragments/hero/dear-all.html">Dear All</button>
    <button type="button" role="tab" id="hero-tab-2" class="hero--links"
        aria-selected="true" aria-controls="hero-panel">My Services</button>
    <button type="button" role="tab" id="hero-tab-3" class="hero--links"
        aria-selected="false" aria-controls="hero-panel"
        hx-get="fragments/hero/for-recruiters.html">For Recruiters</button>
</div>
<div class="hero--txt" id="hero-panel" role="tabpanel" tabindex="0"
    aria-labelledby="hero-tab-2">
    Fractional CTO Service
    <p>Access expertise of seasoned technology leader on a flexible, as-needed basis.
        From developing technology strategies, turning around at-risk projects to TCO optimization.
        Gain an unbiased perspective on technology.</p>
</div>
