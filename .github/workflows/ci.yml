# Checks the invariants that this repo documents but cannot otherwise enforce.
#
# This site has no build step and no test suite, and that is deliberate — see
# ARCHITECTURE.md#no-build-step. So this workflow deliberately does not try to be
# a build. It checks the handful of things that are duplicated by necessity or
# asserted in prose, where a mistake is silent rather than loud.
#
# What it cannot check is the part that actually matters most: keyboard
# operability, focus order, both colour schemes, and Lighthouse. Those need a
# real browser and a human looking at it. AGENTS.md#verifying-a-change is still
# the authority; this only covers the mechanical subset.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # No `cache:` key — there is no package.json to cache against, and naming
      # one fails the step. Node is here only for the one-off design.md linter;
      # it is not a dependency of the site.
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Replaces the old `node --check js/script.js`: there is no JavaScript file
      # left to syntax-check. The interaction is htmx fetching static fragments,
      # and the failure modes moved with it: a fragment that 404s, a work panel
      # whose slug has no section behind it, a trigger that moved inside the
      # region it swaps and can strand focus. A browser reports none of those as
      # an error.
      - name: htmx fragments resolve and keep their focus invariants
        run: python3 scripts/check_htmx.py

      # The check above proves the fragments agree with index.html and
      # portfolio.html. This one proves they are still exactly what the generator
      # produces, so the way to fix a drift is to re-run the generator, not to
      # hand-patch the copy that CI happened to name.
      - name: Work fragments are freshly generated
        run: python3 scripts/propagate_work.py --check

      # The same bargain again, for the Ask page's search index. The embeddings
      # cannot be recomputed here — that needs the model and a browser — so this
      # checks that the text they describe is still the text on portfolio.html. It
      # cannot see prose that was added and never indexed; step 4 of "Verifying a
      # change" in AGENTS.md is what covers that.
      - name: Search index still matches portfolio.html
        run: python3 scripts/check_corpus.py

      - name: Palette is in step across every copy
        run: python3 scripts/check_palette.py

      # Cannot re-run js/grain.js's AES-256-GCM against its own fixtures —
      # stdlib Python has no AES-GCM — so this is a regression pin, not a
      # proof, and says so in its own header comment: see
      # scripts/check_grain.py for exactly what it does and does not catch.
      - name: Grain fixtures still match js/grain.js's format
        run: python3 scripts/check_grain.py

      - name: .nojekyll present and sitemap in step
        run: python3 scripts/check_repo.py

      # game/src/world.rs is generated from the TSVs in game/data, the same
      # bargain as the work fragments above. This step also re-runs the three
      # map assertions, which is the part worth having: a coastline edit that
      # walls a port in, leaves one floating in open ocean or drops two into the
      # same hex fails here rather than being found by sailing into it. One of
      # those three assertions exists because exactly that happened.
      - name: Game world is freshly generated from the map data
        run: python3 scripts/gen_game_data.py --check

      # Verifies assets/game.wasm against the hash committed beside it. Says
      # less than it looks like it says, and scripts/build_game.sh is candid
      # about it in the header: this proves the binary has not been altered
      # since it was committed, not that it is what game/src compiles to. The
      # honest check is a human running the build without --check and reading
      # the diff. No Rust toolchain is needed for this step, which is the point.
      - name: Committed wasm matches its hash
        run: scripts/build_game.sh --check

      # Pinned rather than floating: an unpinned alpha changing under us turns CI
      # red with no change to this repo, which is exactly the maintenance burden
      # the no-toolchain stance exists to avoid.
      #
      # The linter exits 1 on errors but 0 on warnings, and AGENTS.md commits
      # this file to *0 errors and 0 warnings* — so gate on the JSON summary
      # rather than the exit code, or CI would permit a state the docs forbid.
      - name: DESIGN.md conforms to the design.md format
        run: |
          npx --yes @google/design.md@0.4.0 lint DESIGN.md --format=json > lint.json
          cat lint.json
          python3 - <<'PY'
          import json, sys
          report = json.load(open("lint.json"))
          summary = report.get("summary", {})
          errors, warnings = summary.get("errors", 0), summary.get("warnings", 0)
          if errors or warnings:
              print(f"\nDESIGN.md lint: {errors} error(s), {warnings} warning(s).")
              print("AGENTS.md holds this file at 0 and 0 — see step 11.")
              sys.exit(1)
          print("\nDESIGN.md lint: clean.")
          PY

  # A separate job so the one above stays toolchain-free. Nothing is installed
  # here either: GitHub's runners ship a stable Rust, and the tests are a
  # host-native cargo test with no dependencies and no wasm target, so this is
  # a checkout and a compile.
  #
  # This job holds exactly one step on purpose. Everything that does not need
  # Rust belongs in `check` above, so that a red mark here says "the simulation
  # is wrong" and nothing else.
  game:
    name: Simulation tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: cargo test
        run: cargo test --manifest-path game/Cargo.toml
