<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ask has moved to the home page | Tatang Haryadi</title>
    <meta name="description" content="The browser-local search that used to live here is now on the home page." />
    <!-- noindex, and therefore correctly absent from sitemap.xml: this page has no
         content of its own, and two URLs competing for the same search is worse
         than one. scripts/check_repo.py enforces both halves of that. -->
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#dce0e8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#11111b" media="(prefers-color-scheme: dark)" />
    <!-- Pointing at the page the content actually moved to, so any link or search
         result that still names this URL passes its weight along. -->
    <link rel="canonical" href="https://tatangharyadi.github.io/" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />

    <link rel="stylesheet" href="css/style.css" />

    <!-- This file exists only because the URL was published and GitHub Pages
         cannot issue a 301. A meta refresh would arrive faster and is deliberately
         not used: it moves a reader who is mid-sentence and gives a screen reader
         user no chance to hear where they went. A link they choose costs one
         click and explains itself. -->

    <!-- htmx is loaded on every page in this repository, including the ones with
         no hx- attribute of their own, because scripts/check_htmx.py asserts the
         pinned tag per page rather than against a list of pages that happen to
         need it. It is a cache hit after any other page. -->
    <script src="https://unpkg.com/htmx.org@2.0.10/dist/htmx.min.js"
        integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
        crossorigin="anonymous" defer></script>
</head>

<body>
    <!-- No <ul class="nav-links--container"> here on purpose. A page whose only
         job is to forward a reader should not offer them a menu, and
         scripts/check_repo.py compares the nav copies only on pages that have
         one, so this is a deliberate absence rather than a fourth copy to keep in
         step. -->
    <nav>
        <div class="nav--container">
            <div class="logo"><a href="index.html">Tatang.</a></div>
        </div>
    </nav>

    <main class="page">
        <div class="page--container">
            <header class="page--header">
                <h1>Ask has moved</h1>
                <p class="page--lead">The search is no longer a separate page. It is the
                    first thing on the home page now, unchanged: the same model, running
                    in your browser, with nothing sent anywhere.</p>
            </header>

            <p class="page--back"><a href="index.html#ask">Go to the search &rarr;</a></p>

            <p class="page--back"><a href="portfolio.html">Or read the portfolio straight
                    through</a>, without loading anything.</p>
        </div>
    </main>
</body>

</html>
